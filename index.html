<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestaurantOS - To'liq Boshqaruv Tizimi</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; }
        header { background: #2c3e50; color: white; padding: 15px; border-radius: 8px; text-align: center; }
        .container { display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
        .card { background: white; padding: 20px; border-radius: 8px; flex: 1; min-width: 300px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .tables-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
        .table-btn { padding: 18px; border: 3px solid transparent; border-radius: 8px; cursor: pointer; color: white; font-weight: bold; font-size: 15px; }
        .free { background-color: #27ae60; }
        .busy { background-color: #e74c3c; }
        .selected { border-color: #f39c12 !important; box-shadow: 0 0 10px rgba(243, 156, 18, 0.8); }
        .menu-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 8px; border-bottom: 1px solid #eee; }
        .add-btn { background: #3498db; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .order-box { margin-top: 15px; padding: 15px; background: #ecf0f1; border-radius: 6px; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .print-btn { background: #2980b9; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; flex: 1; }
        .close-btn { background: #e67e22; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; flex: 1; }

        /* Forma va qo'shimcha tugmalar */
        .add-form { margin-top: 15px; padding-top: 15px; border-top: 2px dashed #ddd; display: flex; gap: 8px; flex-wrap: wrap; }
        .add-form input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; flex: 1; min-width: 110px; }
        .btn-create { background: #27ae60; color: white; border: none; padding: 10px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }

        /* Chek dizayni (Chop etish uchun) */
        #receipt-area {
            display: none;
            width: 280px;
            padding: 15px;
            background: #fff;
            border: 1px dashed #333;
            font-family: 'Courier New', Courier, monospace;
            margin: 20px auto;
        }

        @media print {
            body * { visibility: hidden; }
            #receipt-area, #receipt-area * { visibility: visible; }
            #receipt-area { display: block !important; position: absolute; left: 0; top: 0; width: 100%; border: none; }
        }
    </style>
</head>
<body>

    <header>
        <h1>RestaurantOS</h1>
        <p>Stollar, dinamik menyu va chek chiqarish tizimi</p>
    </header>

    <div class="container">
        <!-- 1. Stollar moduli -->
        <div class="card">
            <h2>Stollar (Tanlang)</h2>
            <div class="tables-grid" id="tables-container"></div>
            
            <!-- Yangi stol qo'shish tugmasi -->
            <div class="add-form">
                <button class="btn-create" onclick="addNewTable()">+ Yangi stol qo'shish</button>
            </div>
        </div>

        <!-- 2. Menyu moduli -->
        <div class="card">
            <h2>Menyu</h2>
            <div id="menu-container"></div>

            <!-- Yangi taom kiritish bloki -->
            <div class="add-form">
                <input type="text" id="new-food-name" placeholder="Taom nomi">
                <input type="number" id="new-food-price" placeholder="Narxi (so'm)">
                <button class="btn-create" onclick="addNewMenuItem()" style="width: auto;">+ Menyuga qo'shish</button>
            </div>
        </div>

        <!-- 3. Tanlangan stol buyurtmasi -->
        <div class="card">
            <h2 id="order-title">Stol 1 buyurtmasi</h2>
            
            <div class="order-box">
                <h3>Joriy hisob:</h3>
                <ul id="order-list"></ul>
                <h4>Jami: <span id="total-price">0</span> so'm</h4>
                
                <div class="btn-group">
                    <button class="print-btn" onclick="printReceipt()">Chek chiqarish</button>
                    <button class="close-btn" onclick="closeTableOrder()">Hisobni yopish</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Yashirin kassa cheki -->
    <div id="receipt-area">
        <center>
            <h3>=== RESTAURANT OS ===</h3>
            <p>To'lov cheki</p>
            <p id="receipt-date"></p>
            <p><b id="receipt-table"></b></p>
            <hr>
        </center>
        <div id="receipt-items"></div>
        <hr>
        <h4 style="display:flex; justify-content:space-between;">
            <span>JAMI:</span>
            <span id="receipt-total">0 so'm</span>
        </h4>
        <center>
            <p>Xaridingiz uchun rahmat!</p>
        </center>
    </div>

    <script>
        var selectedTable = 1;
        var tableCount = 4;
        var tableOrders = {};

        var menuItems = [
            { name: 'Osh', price: 35000 },
            { name: 'Shashlik', price: 18000 },
            { name: 'Choy', price: 5000 }
        ];

        // Dastlabki stollar buyurtma massivini to'ldirish
        for (var i = 1; i <= tableCount; i++) {
            tableOrders[i] = [];
        }

        function renderTables() {
            var container = document.getElementById('tables-container');
            container.innerHTML = '';

            for (var i = 1; i <= tableCount; i++) {
                var btn = document.createElement('button');
                btn.id = 'btn-' + i;
                
                var isBusy = tableOrders[i] && tableOrders[i].length > 0;
                var statusClass = isBusy ? 'busy' : 'free';
                var statusText = isBusy ? '(Band)' : '(Bo\'sh)';
                var selectedClass = (i === selectedTable) ? ' selected' : '';

                btn.className = 'table-btn ' + statusClass + selectedClass;
                btn.innerText = 'Stol ' + i + ' ' + statusText;
                
                (function(num) {
                    btn.onclick = function() {
                        selectTable(num);
                    };
                })(i);

                container.appendChild(btn);
            }
        }

        function addNewTable() {
            tableCount++;
            tableOrders[tableCount] = [];
            renderTables();
            selectTable(tableCount);
        }

        function selectTable(tableNum) {
            selectedTable = tableNum;

            for (var i = 1; i <= tableCount; i++) {
                var btn = document.getElementById('btn-' + i);
                if (btn) {
                    btn.classList.remove('selected');
                }
            }

            var currentBtn = document.getElementById('btn-' + tableNum);
            if (currentBtn) {
                currentBtn.classList.add('selected');
            }

            document.getElementById('order-title').innerText = 'Stol ' + tableNum + ' buyurtmasi';
            renderOrderList();
        }

        function renderMenu() {
            var container = document.getElementById('menu-container');
            container.innerHTML = '';

            for (var i = 0; i < menuItems.length; i++) {
                var item = menuItems[i];
                var div = document.createElement('div');
                div.className = 'menu-item';
                div.innerHTML = '<span>' + item.name + ' - ' + item.price.toLocaleString() + ' so\'m</span>' +
                                '<button class="add-btn" onclick="addToOrder(\'' + item.name + '\', ' + item.price + ')">Qo\'shish</button>';
                container.appendChild(div);
            }
        }

        function addNewMenuItem() {
            var nameInput = document.getElementById('new-food-name');
            var priceInput = document.getElementById('new-food-price');

            var name = nameInput.value.trim();
            var price = parseInt(priceInput.value);

            if (!name || isNaN(price) || price <= 0) {
                alert('Iltimos, taom nomini va narxini to\'g\'ri kiriting!');
                return;
            }

            menuItems.push({ name: name, price: price });
            renderMenu();

            nameInput.value = '';
            priceInput.value = '';
        }

        function addToOrder(name, price) {
            tableOrders[selectedTable].push({ name: name, price: price });

            var currentBtn = document.getElementById('btn-' + selectedTable);
            currentBtn.className = 'table-btn busy selected';
            currentBtn.innerText = 'Stol ' + selectedTable + ' (Band)';

            renderOrderList();
        }

        function renderOrderList() {
            var list = document.getElementById('order-list');
            list.innerHTML = '';
            var total = 0;

            var currentOrders = tableOrders[selectedTable] || [];
            for (var i = 0; i < currentOrders.length; i++) {
                var li = document.createElement('li');
                li.innerText = currentOrders[i].name + ' - ' + currentOrders[i].price.toLocaleString() + ' so\'m';
                list.appendChild(li);
                total = total + currentOrders[i].price;
            }

            document.getElementById('total-price').innerText = total.toLocaleString();
        }

        function closeTableOrder() {
            if (!tableOrders[selectedTable] || tableOrders[selectedTable].length === 0) {
                alert('Bu stolda hali buyurtma yo\'q!');
                return;
            }

            if (confirm('Stol ' + selectedTable + ' hisobi yopilsinmi?')) {
                tableOrders[selectedTable] = [];

                var currentBtn = document.getElementById('btn-' + selectedTable);
                currentBtn.className = 'table-btn free selected';
                currentBtn.innerText = 'Stol ' + selectedTable + ' (Bo\'sh)';

                renderOrderList();
            }
        }

        function printReceipt() {
            var currentOrders = tableOrders[selectedTable];
            if (!currentOrders || currentOrders.length === 0) {
                alert('Chek chiqarish uchun avval taom qo\'shing!');
                return;
            }

            var now = new Date();
            var dateStr = now.toLocaleDateString() + ' ' + now.toLocaleTimeString();

            document.getElementById('receipt-date').innerText = dateStr;
            document.getElementById('receipt-table').innerText = 'Stol raqami: #' + selectedTable;

            var itemsContainer = document.getElementById('receipt-items');
            itemsContainer.innerHTML = '';
            var total = 0;

            for (var i = 0; i < currentOrders.length; i++) {
                var row = document.createElement('div');
                row.style.display = 'flex';
                row.style.justifyContent = 'space-between';
                row.style.marginBottom = '5px';
                row.innerHTML = '<span>' + currentOrders[i].name + '</span><span>' + currentOrders[i].price.toLocaleString() + ' so\'m</span>';
                itemsContainer.appendChild(row);
                total = total + currentOrders[i].price;
            }

            document.getElementById('receipt-total').innerText = total.toLocaleString() + ' so\'m';
            window.print();
        }

        // Boshlang'ich elementlarni chizish
        renderTables();
        renderMenu();
    </script>
</body>
</html>
