<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestaurantOS</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; }
        header { background: #2c3e50; color: white; padding: 15px; border-radius: 8px; text-align: center; }
        .container { display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
        .card { background: white; padding: 20px; border-radius: 8px; flex: 1; min-width: 300px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .full-width { width: 100%; flex: 100%; box-sizing: border-box; }
        .tables-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
        .table-btn { padding: 18px; border: 3px solid transparent; border-radius: 8px; cursor: pointer; color: white; font-weight: bold; font-size: 15px; }
        .free { background-color: #27ae60; }
        .busy { background-color: #e74c3c; }
        .selected { border-color: #f39c12 !important; box-shadow: 0 0 10px rgba(243, 156, 18, 0.8); }
        .menu-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 8px; border-bottom: 1px solid #eee; }
        .add-btn { background: #3498db; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .order-box { margin-top: 15px; padding: 15px; background: #ecf0f1; border-radius: 6px; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .print-btn { background: #2980b9; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; flex: 1; }
        .close-btn { background: #e67e22; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; flex: 1; }
        .delete-btn { background: #c0392b; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .add-form { margin-top: 15px; padding-top: 15px; border-top: 2px dashed #ddd; display: flex; gap: 8px; flex-wrap: wrap; }
        .add-form input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; flex: 1; }
        .btn-green { background: #27ae60; color: white; border: none; padding: 10px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }
        .stats-grid { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 15px; }
        .stat-box { flex: 1; min-width: 180px; background: #f8f9fa; border-left: 5px solid #27ae60; padding: 15px; border-radius: 6px; }
        .stat-box h4 { margin: 0 0 5px 0; color: #7f8c8d; }
        .stat-box .val { font-size: 20px; font-weight: bold; color: #2c3e50; }
        .history-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .history-table th, .history-table td { padding: 8px; border-bottom: 1px solid #eee; text-align: left; }
        .history-table th { background: #f1f2f6; }

        @media print {
            body * { visibility: hidden; }
            #receipt-area, #receipt-area * { visibility: visible; }
            #receipt-area { display: block !important; position: absolute; left: 0; top: 0; width: 100%; }
        }
        #receipt-area { display: none; width: 280px; padding: 15px; border: 1px dashed #000; font-family: monospace; }
    </style>
</head>
<body>

    <header>
        <h1>RestaurantOS</h1>
        <p>Boshqaruv, Kassa va Kunlik Hisobot</p>
    </header>

    <div class="container">
        <!-- Stollar -->
        <div class="card">
            <h2>Stollar (Tanlang)</h2>
            <div class="tables-grid" id="tables-container"></div>
            <div class="add-form">
                <button class="btn-green" onclick="addNewTable()">+ Yangi stol qo'shish</button>
            </div>
        </div>

        <!-- Menyu -->
        <div class="card">
            <h2>Menyu</h2>
            <div id="menu-container"></div>
            <div class="add-form">
                <input type="text" id="new-name" placeholder="Taom nomi">
                <input type="number" id="new-price" placeholder="Narxi">
                <button class="btn-green" style="width: auto;" onclick="addNewMenuItem()">+ Menyuga qo'shish</button>
            </div>
        </div>

        <!-- Joriy stol -->
        <div class="card">
            <h2 id="order-title">Stol 1 buyurtmasi</h2>
            <div class="order-box">
                <h3>Joriy hisob:</h3>
                <ul id="order-list"></ul>
                <h4>Jami: <span id="total-price">0</span> so'm</h4>
                <div class="btn-group">
                    <button class="print-btn" onclick="printReceipt()">Chek chiqarish</button>
                    <button class="close-btn" onclick="closeTableOrder()">Hisobni yopish</button>
                </div>
                <button class="delete-btn" onclick="deleteCurrentTable()">🗑 Ushbu stolni o'chirish</button>
            </div>
        </div>

        <!-- Kunlik Hisobot -->
        <div class="card full-width">
            <h2>Kunlik Kassa Hisoboti</h2>
            <div class="stats-grid">
                <div class="stat-box">
                    <h4>BUGUNGI TUSHUM</h4>
                    <div class="val" id="stat-rev">0 so'm</div>
                </div>
                <div class="stat-box" style="border-color:#3498db;">
                    <h4>YOPILGAN CHEKLAR</h4>
                    <div class="val" id="stat-cnt">0 ta</div>
                </div>
            </div>
            <table class="history-table">
                <thead>
                    <tr><th>Vaqt</th><th>Stol</th><th>Taomlar</th><th>Summa</th></tr>
                </thead>
                <tbody id="history-rows"></tbody>
            </table>
        </div>
    </div>

    <!-- Chop etish cheki -->
    <div id="receipt-area">
        <center>
            <h3>RESTAURANT OS</h3>
            <p>To'lov Cheki</p>
            <p id="rc-date"></p>
            <p><b id="rc-table"></b></p>
            <hr>
        </center>
        <div id="rc-items"></div>
        <hr>
        <h4>JAMI: <span id="rc-total">0</span> so'm</h4>
    </div>

    <script>
        var selectedTable = 1;
        var tableCount = 4;
        var menuItems = [
            { name: 'Osh', price: 35000 },
            { name: 'Shashlik', price: 18000 },
            { name: 'Choy', price: 5000 }
        ];
        var tableOrders = {};
        var salesHistory = [];

        // Xotirani o'qish
        try {
            var sc = localStorage.getItem('res_table_count');
            if (sc && parseInt(sc) > 0) {
                tableCount = parseInt(sc);
            }
            var sm = localStorage.getItem('res_menu');
            if (sm) {
                menuItems = JSON.parse(sm);
            }
            var so = localStorage.getItem('res_orders');
            if (so) {
                tableOrders = JSON.parse(so);
            }
            var sh = localStorage.getItem('res_sales_history');
            if (sh) {
                salesHistory = JSON.parse(sh);
            }
        } catch(e) {}

        // Bo'sh stollarni tayyorlash
        for (var i = 1; i <= tableCount; i++) {
            if (!tableOrders[i]) {
                tableOrders[i] = [];
            }
        }

        function saveData() {
            try {
                localStorage.setItem('res_table_count', tableCount);
                localStorage.setItem('res_menu', JSON.stringify(menuItems));
                localStorage.setItem('res_orders', JSON.stringify(tableOrders));
                localStorage.setItem('res_sales_history', JSON.stringify(salesHistory));
            } catch(e) {}
        }

        function renderTables() {
            var box = document.getElementById('tables-container');
            box.innerHTML = '';
            for (var i = 1; i <= tableCount; i++) {
                var btn = document.createElement('button');
                var isBusy = tableOrders[i] && tableOrders[i].length > 0;
                btn.className = 'table-btn ' + (isBusy ? 'busy' : 'free') + (i === selectedTable ? ' selected' : '');
                btn.innerText = 'Stol ' + i + ' ' + (isBusy ? '(Band)' : '(Bo\'sh)');
                
                (function(num) {
                    btn.onclick = function() {
                        selectTable(num);
                    };
                })(i);

                box.appendChild(btn);
            }
        }

        function renderMenu() {
            var box = document.getElementById('menu-container');
            box.innerHTML = '';
            for (var i = 0; i < menuItems.length; i++) {
                var item = menuItems[i];
                var div = document.createElement('div');
                div.className = 'menu-item';
                div.innerHTML = '<span>' + item.name + ' - ' + item.price.toLocaleString() + ' so\'m</span>' +
                                '<button class="add-btn" onclick="addToOrder(\'' + item.name + '\', ' + item.price + ')">Qo\'shish</button>';
                box.appendChild(div);
            }
        }

        function selectTable(num) {
            selectedTable = num;
            renderTables();
            document.getElementById('order-title').innerText = 'Stol ' + num + ' buyurtmasi';
            renderOrder();
        }

        function addToOrder(name, price) {
            if (!tableOrders[selectedTable]) {
                tableOrders[selectedTable] = [];
            }
            tableOrders[selectedTable].push({ name: name, price: price });
            saveData();
            renderTables();
            renderOrder();
        }

        function renderOrder() {
            var list = document.getElementById('order-list');
            list.innerHTML = '';
            var total = 0;
            var cur = tableOrders[selectedTable] || [];
            for (var i = 0; i < cur.length; i++) {
                var li = document.createElement('li');
                li.innerText = cur[i].name + ' - ' + cur[i].price.toLocaleString() + ' so\'m';
                list.appendChild(li);
                total += cur[i].price;
            }
            document.getElementById('total-price').innerText = total.toLocaleString();
        }

        function addNewTable() {
            tableCount++;
            tableOrders[tableCount] = [];
            saveData();
            renderTables();
            selectTable(tableCount);
        }

        function addNewMenuItem() {
            var n = document.getElementById('new-name').value.trim();
            var p = parseInt(document.getElementById('new-price').value);
            if (!n || isNaN(p) || p <= 0) {
                alert('Nomi va narxini to\'g\'ri yozing');
                return;
            }
            menuItems.push({ name: n, price: p });
            saveData();
            renderMenu();
            document.getElementById('new-name').value = '';
            document.getElementById('new-price').value = '';
        }

        function closeTableOrder() {
            var cur = tableOrders[selectedTable] || [];
            if (cur.length === 0) {
                alert('Stolda buyurtma yo\'q');
                return;
            }
            var sum = 0, items = [];
            for (var i = 0; i < cur.length; i++) {
                sum += cur[i].price;
                items.push(cur[i].name);
            }
            if (confirm('Stol ' + selectedTable + ' hisobi yopilsinmi?')) {
                var d = new Date();
                salesHistory.unshift({
                    time: d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    table: selectedTable,
                    items: items.join(', '),
                    total: sum
                });
                tableOrders[selectedTable] = [];
                saveData();
                renderTables();
                renderOrder();
                renderReports();
            }
        }

        function deleteCurrentTable() {
            if (tableCount <= 1) {
                alert('Kamida bitta stol qolishi kerak');
                return;
            }
            var cur = tableOrders[selectedTable] || [];
            if (cur.length > 0) {
                var word = prompt('DIQQAT! Stolda to\'lanmagan hisob bor. O\'chirish uchun "OCHIRISH" so\'zini yozing:');
                if (word !== 'OCHIRISH') {
                    alert('Bekor qilindi');
                    return;
                }
            } else {
                if (!confirm('Stol ' + selectedTable + ' o\'chirilsinmi?')) return;
            }

            var newOrd = {};
            var c = 1;
            for (var i = 1; i <= tableCount; i++) {
                if (i !== selectedTable) {
                    newOrd[c] = tableOrders[i] || [];
                    c++;
                }
            }
            tableCount--;
            tableOrders = newOrd;
            selectedTable = 1;
            saveData();
            renderTables();
            selectTable(1);
        }

        function renderReports() {
            var tot = 0;
            var tbody = document.getElementById('history-rows');
            tbody.innerHTML = '';
            for (var i = 0; i < salesHistory.length; i++) {
                var r = salesHistory[i];
                tot += r.total;
                var tr = document.createElement('tr');
                tr.innerHTML = '<td>' + r.time + '</td><td>Stol ' + r.table + '</td><td>' + r.items + '</td><td style="color:green;font-weight:bold;">' + r.total.toLocaleString() + ' so\'m</td>';
                tbody.appendChild(tr);
            }
            document.getElementById('stat-rev').innerText = tot.toLocaleString() + ' so\'m';
            document.getElementById('stat-cnt').innerText = salesHistory.length + ' ta';
        }

        function printReceipt() {
            var cur = tableOrders[selectedTable] || [];
            if (cur.length === 0) {
                alert('Buyurtma yo\'q');
                return;
            }
            document.getElementById('rc-date').innerText = new Date().toLocaleString();
            document.getElementById('rc-table').innerText = 'Stol #' + selectedTable;
            var box = document.getElementById('rc-items');
            box.innerHTML = '';
            var sum = 0;
            for (var i = 0; i < cur.length; i++) {
                box.innerHTML += '<div>' + cur[i].name + ' - ' + cur[i].price.toLocaleString() + ' so\'m</div>';
                sum += cur[i].price;
            }
            document.getElementById('rc-total').innerText = sum.toLocaleString();
            window.print();
        }

        // Boshlang'ich render
        saveData();
        renderTables();
        renderMenu();
        selectTable(1);
        renderReports();
    </script>
</body>
</html>
