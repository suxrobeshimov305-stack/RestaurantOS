<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestaurantOS - Zonalarga Ajratilgan Stollar</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; }
        header { background: #2c3e50; color: white; padding: 15px; border-radius: 8px; text-align: center; }
        .container { display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
        .card { background: white; padding: 20px; border-radius: 8px; flex: 1; min-width: 320px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .full-width { width: 100%; flex: 100%; box-sizing: border-box; }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .card-header h2 { margin: 0; }
        .btn-settings { background: transparent; border: 1px solid #bdc3c7; border-radius: 6px; padding: 4px 10px; font-size: 20px; cursor: pointer; color: #2c3e50; line-height: 1; }
        .btn-settings:hover { background: #ecf0f1; }

        /* Zonalar filtri stillari */
        .zone-filter-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid #eee; }
        .zone-btn { background: #e0e0e0; color: #333; border: none; padding: 7px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: bold; white-space: nowrap; transition: 0.2s; }
        .zone-btn.active { background: #2c3e50; color: white; }

        .tables-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
        .table-btn { padding: 14px 10px; border: 3px solid transparent; border-radius: 8px; cursor: pointer; color: white; font-weight: bold; font-size: 14px; text-align: center; }
        .table-btn small { display: block; font-size: 11px; font-weight: normal; margin-top: 4px; opacity: 0.9; }
        .free { background-color: #27ae60; }
        .busy { background-color: #e74c3c; }
        .selected { border-color: #f39c12 !important; box-shadow: 0 0 10px rgba(243, 156, 18, 0.8); }
        
        .menu-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 10px; border-bottom: 1px solid #eee; background: #fafafa; border-radius: 6px; }
        .add-btn { background: #3498db; color: white; border: none; padding: 8px 14px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .add-btn:hover { background: #2980b9; }

        .order-box { margin-top: 15px; padding: 15px; background: #ecf0f1; border-radius: 6px; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .print-btn { background: #2980b9; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; flex: 1; }
        .close-btn { background: #e67e22; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; flex: 1; }
        .delete-btn { background: #c0392b; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        
        .add-form { margin-top: 15px; padding-top: 15px; border-top: 2px dashed #ddd; display: flex; gap: 8px; flex-wrap: wrap; }
        .add-form select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; flex: 1; min-width: 140px; }
        .btn-green { background: #27ae60; color: white; border: none; padding: 10px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }

        .stats-grid { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 15px; }
        .stat-box { flex: 1; min-width: 180px; background: #f8f9fa; border-left: 5px solid #27ae60; padding: 15px; border-radius: 6px; }
        .stat-box h4 { margin: 0 0 5px 0; color: #7f8c8d; }
        .stat-box .val { font-size: 20px; font-weight: bold; color: #2c3e50; }
        .history-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .history-table th, .history-table td { padding: 8px; border-bottom: 1px solid #eee; text-align: left; }
        .history-table th { background: #f1f2f6; }

        /* Modal oynalar */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); z-index: 1000; justify-content: center; align-items: center; }
        .modal-card { background: white; padding: 22px; border-radius: 10px; max-width: 500px; width: 92%; max-height: 85vh; overflow-y: auto; box-shadow: 0 5px 25px rgba(0,0,0,0.3); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .close-modal-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #7f8c8d; }
        .manage-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .manage-table th, .manage-table td { padding: 10px; border-bottom: 1px solid #eee; text-align: left; font-size: 14px; }
        .manage-actions { display: flex; gap: 6px; justify-content: flex-end; }
        .btn-action-edit { background: #f39c12; color: white; border: none; padding: 5px 9px; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .btn-action-del { background: #e74c3c; color: white; border: none; padding: 5px 9px; border-radius: 4px; cursor: pointer; font-size: 13px; }

        .modal-add-box { display: flex; gap: 8px; margin-top: 15px; padding-top: 15px; border-top: 2px dashed #eee; flex-wrap: wrap; }
        .modal-add-box input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; flex: 1; min-width: 120px; }
        .modal-add-box button { background: #27ae60; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; }

        @media print {
            body * { visibility: hidden; }
            #receipt-area, #receipt-area * { visibility: visible; }
            #receipt-area { display: block !important; position: absolute; left: 0; top: 0; width: 100%; }
        }
        #receipt-area { display: none; width: 280px; padding: 15px; border: 1px dashed #000; font-family: monospace; }
    </style>
</head>
<body>

    <header>
        <h1>RestaurantOS</h1>
        <p>Zonalar, Menyu va Kunlik Kassa Tizimi</p>
    </header>

    <div class="container">
        <!-- 1. Stollar moduli -->
        <div class="card">
            <h2>Stollar (Tanlang)</h2>
            
            <!-- Zonalar filtri -->
            <div class="zone-filter-bar" id="zone-filter-bar"></div>

            <div class="tables-grid" id="tables-container"></div>
            
            <!-- Yangi stol qo'shish -->
            <div class="add-form">
                <select id="new-table-zone">
                    <option value="Asosiy zal">Asosiy zal</option>
                    <option value="Hovli (Leto)">Hovli (Leto)</option>
                    <option value="Banket zali">Banket zali</option>
                    <option value="VIP xona">VIP xona</option>
                </select>
                <button class="btn-green" id="btn-add-table" type="button" style="width: auto; flex: 1;">+ Stol qo'shish</button>
            </div>
        </div>

        <!-- 2. Menyu moduli -->
        <div class="card">
            <div class="card-header">
                <h2>Menyu</h2>
                <button class="btn-settings" id="btn-open-menu-manager" title="Menyuni boshqarish">⋮</button>
            </div>
            <div id="menu-container"></div>
        </div>

        <!-- 3. Tanlangan stol buyurtmasi -->
        <div class="card">
            <h2 id="order-title">Stol buyurtmasi</h2>
            <div class="order-box">
                <h3>Joriy hisob:</h3>
                <ul id="order-list"></ul>
                <h4>Jami: <span id="total-price">0</span> so'm</h4>
                <div class="btn-group">
                    <button class="print-btn" id="btn-print" type="button">Chek chiqarish</button>
                    <button class="close-btn" id="btn-close-order" type="button">Hisobni yopish</button>
                </div>
                <button class="delete-btn" id="btn-delete-table" type="button">🗑 Ushbu stolni o'ch
