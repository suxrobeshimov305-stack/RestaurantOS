<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestaurantOS - Boshqaruv Tizimi</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; }
        header { background: #2c3e50; color: white; padding: 15px; border-radius: 8px; text-align: center; }
        .container { display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
        .card { background: white; padding: 20px; border-radius: 8px; flex: 1; min-width: 300px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .tables-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
        .table-btn { padding: 20px; border: none; border-radius: 8px; cursor: pointer; color: white; font-weight: bold; font-size: 16px; }
        .free { background-color: #27ae60; }
        .busy { background-color: #e74c3c; }
        .menu-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 8px; border-bottom: 1px solid #eee; }
        .add-btn { background: #3498db; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .order-box { margin-top: 15px; padding: 10px; background: #ecf0f1; border-radius: 5px; }
    </style>
</head>
<body>

    <header>
        <h1>RestaurantOS</h1>
        <p>Kichik restoran boshqaruv tizimi (MVP)</p>
    </header>

    <div class="container">
        <!-- 1. Stollar moduli -->
        <div class="card">
            <h2>Stollar holati</h2>
            <div class="tables-grid">
                <button class="table-btn free" onclick="toggleTable(this, 1)">Stol 1 (Bo'sh)</button>
                <button class="table-btn free" onclick="toggleTable(this, 2)">Stol 2 (Bo'sh)</button>
                <button class="table-btn free" onclick="toggleTable(this, 3)">Stol 3 (Bo'sh)</button>
                <button class="table-btn free" onclick="toggleTable(this, 4)">Stol 4 (Bo'sh)</button>
            </div>
        </div>

        <!-- 2. Menyu va Buyurtma moduli -->
        <div class="card">
            <h2>Menyu va Buyurtma</h2>
            <div class="menu-item">
                <span>Osh - 35 000 so'm</span>
                <button class="add-btn" onclick="addToOrder('Osh', 35000)">Qo'shish</button>
            </div>
            <div class="menu-item">
                <span>Shashlik - 18 000 so'm</span>
                <button class="add-btn" onclick="addToOrder('Shashlik', 18000)">Qo'shish</button>
            </div>
            <div class="menu-item">
                <span>Choy - 5 000 so'm</span>
                <button class="add-btn" onclick="addToOrder('Choy', 5000)">Qo'shish</button>
            </div>

            <div class="order-box">
                <h3>Joriy buyurtma:</h3>
                <ul id="order-list"></ul>
                <h4>Jami: <span id="total-price">0</span> so'm</h4>
            </div>
        </div>
    </div>

    <script>
        function toggleTable(btn, num) {
            if (btn.className.indexOf('free') !== -1) {
                btn.className = 'table-btn busy';
                btn.innerText = 'Stol ' + num + ' (Band)';
            } else {
                btn.className = 'table-btn free';
                btn.innerText = 'Stol ' + num + ' (Bo\'sh)';
            }
        }

        var total = 0;
        function addToOrder(name, price) {
            var list = document.getElementById('order-list');
            var li = document.createElement('li');
            li.innerText = name + ' - ' + price + ' so\'m';
            list.appendChild(li);

            total = total + price;
            document.getElementById('total-price').innerText = total;
        }
    </script>
</body>
</html>
