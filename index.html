<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestaurantOS - Kassa va Chek</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; }
        header { background: #2c3e50; color: white; padding: 15px; border-radius: 8px; text-align: center; }
        .container { display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
        .card { background: white; padding: 20px; border-radius: 8px; flex: 1; min-width: 300px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .tables-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
        .table-btn { padding: 18px; border: 3px solid transparent; border-radius: 8px; cursor: pointer; color: white; font-weight: bold; font-size: 15px; }
        .free { background-color: #27ae60; }
        .busy { background-color: #e74c3c; }
        .selected { border-color: #f39c12 !important; box-shadow: 0 0 10px rgba(243, 156, 18, 0.8); }
        .menu-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 8px; border-bottom: 1px solid #eee; }
        .add-btn { background: #3498db; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .order-box { margin-top: 15px; padding: 15px; background: #ecf0f1; border-radius: 6px; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .print-btn { background: #2980b9; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; flex: 1; }
        .close-btn { background: #e67e22; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; flex: 1; }

        /* Chek dizayni (Chop etish uchun) */
        #receipt-area {
            display: none;
            width: 280px;
            padding: 15px;
            background: #fff;
            border: 1px dashed #333;
            font-family: 'Courier New', Courier, monospace;
            margin: 20px auto;
        }

        @media print {
            body * { visibility: hidden; }
            #receipt-area, #receipt-area * { visibility: visible; }
            #receipt-area { display: block !important; position: absolute; left: 0; top: 0; width: 100%; border: none; }
        }
    </style>
</head>
<body>

    <header>
        <h1>RestaurantOS</h1>
        <p>Stollar, buyurtmalar va to'lov cheki tizimi</p>
    </header>

    <div class="container">
        <!-- 1. Stollar moduli -->
        <div class="card">
            <h2>Stollar (Tanlang)</h2>
            <div class="tables-grid">
                <button id="btn-1" class="table-btn free selected" onclick="selectTable(1)">Stol 1 (Bo'sh)</button>
                <button id="btn-2" class="table-btn free" onclick="selectTable(2)">Stol 2 (Bo'sh)</button>
                <button id="btn-3" class="table-btn free" onclick="selectTable(3)">Stol 3 (Bo'sh)</button>
                <button id="btn-4" class="table-btn free" onclick="selectTable(4)">Stol 4 (Bo'sh)</button>
            </div>
        </div>

        <!-- 2. Menyu va Buyurtma -->
        <div class="card">
            <h2 id="order-title">Stol 1 buyurtmasi</h2>
            
            <div class="menu-item">
                <span>Osh - 35 000 so'm</span>
                <button class="add-btn" onclick="addToOrder('Osh', 35000)">Qo'shish</button>
            </div>
            <div class="menu-item">
                <span>Shashlik - 18 000 so'm</span>
                <button class="add-btn" onclick="addToOrder('Shashlik', 18000)">Qo'shish</button>
            </div>
            <div class="menu-item">
                <span>Choy - 5 000 so'm</span>
                <button class="add-btn" onclick="addToOrder('Choy', 5000)">Qo'shish</button>
            </div>

            <div class="order-box">
                <h3>Joriy hisob:</h3>
                <ul id="order-list"></ul>
                <h4>Jami: <span id="total-price">0</span> so'm</h4>
                
                <div class="btn-group">
                    <button class="print-btn" onclick="printReceipt()">Chek chiqarish</button>
                    <button class="close-btn" onclick="closeTableOrder()">Hisobni yopish</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Yashirin kassa cheki bloki -->
    <div id="receipt-area">
        <center>
            <h3>=== RESTAURANT OS ===</h3>
            <p>To'lov cheki</p>
            <p id="receipt-date"></p>
            <p><b id="receipt-table"></b></p>
            <hr>
        </center>
        <div id="receipt-items"></div>
        <hr>
        <h4 style="display:flex; justify-content:space-between;">
            <span>JAMI:</span>
            <span id="receipt-total">0 so'm</span>
        </h4>
        <center>
            <p>Xaridingiz uchun rahmat!</p>
        </center>
    </div>

    <script>
        var selectedTable = 1;
        var tableOrders = {
            1: [],
            2: [],
            3: [],
            4: []
        };

        function selectTable(tableNum) {
            selectedTable = tableNum;

            for (var i = 1; i <= 4; i++) {
                var btn = document.getElementById('btn-' + i);
                if (btn) {
                    btn.classList.remove('selected');
                }
            }

            var currentBtn = document.getElementById('btn-' + tableNum);
            if (currentBtn) {
                currentBtn.classList.add('selected');
            }

            document.getElementById('order-title').innerText = 'Stol ' + tableNum + ' buyurtmasi';
            renderOrderList();
        }

        function addToOrder(name, price) {
            tableOrders[selectedTable].push({ name: name, price: price });

            var currentBtn = document.getElementById('btn-' + selectedTable);
            currentBtn.className = 'table-btn busy selected';
            currentBtn.innerText = 'Stol ' + selectedTable + ' (Band)';

            renderOrderList();
        }

        function renderOrderList() {
            var list = document.getElementById('order-list');
            list.innerHTML = '';
            var total = 0;

            var currentOrders = tableOrders[selectedTable];
            for (var i = 0; i < currentOrders.length; i++) {
                var li = document.createElement('li');
                li.innerText = currentOrders[i].name + ' - ' + currentOrders[i].price + ' so\'m';
                list.appendChild(li);
                total = total + currentOrders[i].price;
            }

            document.getElementById('total-price').innerText = total;
        }

        function closeTableOrder() {
            if (tableOrders[selectedTable].length === 0) {
                alert('Bu stolda hali buyurtma yo\'q!');
                return;
            }

            if (confirm('Stol ' + selectedTable + ' hisobi yopilsinmi?')) {
                tableOrders[selectedTable] = [];

                var currentBtn = document.getElementById('btn-' + selectedTable);
                currentBtn.className = 'table-btn free selected';
                currentBtn.innerText = 'Stol ' + selectedTable + ' (Bo\'sh)';

                renderOrderList();
            }
        }

        function printReceipt() {
            var currentOrders = tableOrders[selectedTable];
            if (currentOrders.length === 0) {
                alert('Chek chiqarish uchun avval taom qo\'shing!');
                return;
            }

            var now = new Date();
            var dateStr = now.toLocaleDateString() + ' ' + now.toLocaleTimeString();

            document.getElementById('receipt-date').innerText = dateStr;
            document.getElementById('receipt-table').innerText = 'Stol raqami: #' + selectedTable;

            var itemsContainer = document.getElementById('receipt-items');
            itemsContainer.innerHTML = '';
            var total = 0;

            for (var i = 0; i < currentOrders.length; i++) {
                var row = document.createElement('div');
                row.style.display = 'flex';
                row.style.justifyContent = 'space-between';
                row.style.marginBottom = '5px';
                row.innerHTML = '<span>' + currentOrders[i].name + '</span><span>' + currentOrders[i].price + ' so\'m</span>';
                itemsContainer.appendChild(row);
                total = total + currentOrders[i].price;
            }

            document.getElementById('receipt-total').innerText = total + ' so\'m';

            // Brauzerning standart chop etish oynasini ochadi
            window.print();
        }
    </script>
</body>
</html>
