<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestaurantOS - Stop-list va Kassa Tizimi</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; }
        header { background: #2c3e50; color: white; padding: 15px 20px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .nav-tabs { display: flex; gap: 10px; flex-wrap: wrap; }
        .nav-btn { background: #34495e; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; position: relative; }
        .nav-btn.active { background: #27ae60; color: white; }
        
        .container { display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
        .card { background: white; padding: 20px; border-radius: 8px; flex: 1; min-width: 320px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .full-width { width: 100%; flex: 100%; box-sizing: border-box; }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .card-header h2 { margin: 0; font-size: 19px; }
        .btn-settings { background: transparent; border: 1px solid #bdc3c7; border-radius: 6px; padding: 4px 10px; font-size: 20px; cursor: pointer; color: #2c3e50; line-height: 1; }
        .btn-settings:hover { background: #ecf0f1; }

        .zone-filter-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid #eee; }
        .zone-btn { background: #e0e0e0; color: #333; border: none; padding: 7px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: bold; white-space: nowrap; }
        .zone-btn.active { background: #2c3e50; color: white; }

        .tables-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
        .table-btn { padding: 14px 10px; border: 3px solid transparent; border-radius: 8px; cursor: pointer; color: white; font-weight: bold; font-size: 14px; text-align: center; position: relative; }
        .free { background-color: #27ae60; }
        .busy { background-color: #e74c3c; }
        .reserved { background-color: #f39c12; }
        .selected { border-color: #34495e !important; box-shadow: 0 0 10px rgba(52, 73, 94, 0.8); }

        @keyframes pulse-ready {
            0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.9); border-color: #2ecc71; }
            70% { box-shadow: 0 0 0 12px rgba(46, 204, 113, 0); border-color: #27ae60; }
            100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); border-color: #2ecc71; }
        }
        .table-ready-alert {
            animation: pulse-ready 1.2s infinite;
            background-color: #1abc9c !important;
            border-color: #f1c40f !important;
        }
        
        /* Menyu taomlari va Stop-list ko'rinishi */
        .menu-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 10px; border-bottom: 1px solid #eee; background: #fafafa; border-radius: 6px; transition: 0.2s; }
        .menu-item.stopped { background: #fee2e2; opacity: 0.7; border-color: #fca5a5; }
        .item-badge { display: inline-block; font-size: 11px; padding: 2px 6px; border-radius: 4px; background: #e2e8f0; color: #475569; margin-left: 6px; font-weight: normal; }
        .badge-stop { background: #ef4444; color: white; font-weight: bold; }
        
        .add-btn { background: #3498db; color: white; border: none; padding: 8px 14px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .add-btn:hover { background: #2980b9; }
        .add-btn:disabled { background: #94a3b8; cursor: not-allowed; }

        .order-box { margin-top: 15px; padding: 15px; background: #ecf0f1; border-radius: 6px; }

        .order-item-info { flex: 1; }
